name: Facebook · pasadas

on:
  schedule:
    # 1 pasada al día, a las 20:00 de Chile en horario de verano (cuando más se publica).
    # El proxy se paga por GB: con 2 búsquedas y 3 detalles por ficha son unos 50 MB por pasada.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      max_busquedas:
        description: "Máximo de búsquedas en Marketplace por ficha"
        type: string
        default: "2"
      detalles:
        description: "Máximo de avisos nuevos a abrir por ficha"
        type: string
        default: "3"

permissions:
  contents: read

concurrency:
  group: facebook
  cancel-in-progress: false

jobs:
  pasada:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LISTO: ${{ secrets.SUPABASE_SECRET_KEY != '' }}
    steps:
      - name: Falta configurar
        if: env.LISTO != 'true'
        run: echo "::warning::Facebook necesita el secreto SUPABASE_SECRET_KEY; no se corre."

      - uses: actions/checkout@v5
        if: env.LISTO == 'true'

      - uses: pnpm/action-setup@v4
        if: env.LISTO == 'true'

      - uses: actions/setup-node@v5
        if: env.LISTO == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        if: env.LISTO == 'true'
        run: pnpm install --frozen-lockfile --filter "@radar/worker..."

      - name: Pasada
        if: env.LISTO == 'true'
        working-directory: apps/worker
        env:
          FUENTE: facebook
          SUPABASE_URL: https://ssmtlqtpzzhkhibkcfhi.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          # Sin proxy se corre igual (decisión de Raimundo: probar primero así, con más riesgo para la cuenta).
          FB_SIN_PROXY: ${{ secrets.PROXY_URL == '' && '1' || '0' }}
          TIPO: ${{ github.event_name == 'schedule' && 'corta' || 'prueba' }}
          MAX_PAGINAS: ${{ inputs.max_busquedas || '2' }}
          DETALLES: ${{ inputs.detalles || '3' }}
          HEADLESS: "0"
        run: xvfb-run -a pnpm pasada

      # Sin capturas como artefacto: el repo es público y podrían mostrar datos de la cuenta.
