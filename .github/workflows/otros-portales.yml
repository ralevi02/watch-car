name: Kavak, Yapo, MercadoLibre y Bruno Fritsch · pasadas
# La app lee la fuente desde el título para mostrar qué está corriendo.
run-name: Kavak, Yapo, MercadoLibre y Bruno Fritsch · ${{ inputs.fuente || 'todas' }}

on:
  schedule:
    # MercadoLibre y Bruno Fritsch (sin proxy) a las 12:10; todas a las 19:40 de Chile en horario
    # de verano. Kavak y Yapo van por el proxy, que se paga por GB: solo 1 vez al día.
    - cron: "10 15 * * *"
    - cron: "40 22 * * *"
  workflow_dispatch:
    inputs:
      fuente:
        description: "Qué portal correr"
        type: choice
        options: [todas, kavak, yapo, mercadolibre, brunofritsch]
        default: todas

permissions:
  contents: read

concurrency:
  group: otros-portales
  cancel-in-progress: false

jobs:
  pasada:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Una fuente detrás de otra, y si una falla las demás siguen.
      max-parallel: 1
      fail-fast: false
      matrix:
        fuente: ${{ fromJSON((inputs.fuente && inputs.fuente != 'todas') && format('["{0}"]', inputs.fuente) || (github.event.schedule == '10 15 * * *' && '["mercadolibre","brunofritsch"]' || '["kavak","yapo","mercadolibre","brunofritsch"]')) }}
    env:
      TIENE_SUPABASE: ${{ secrets.SUPABASE_SECRET_KEY != '' }}
    steps:
      - name: Falta configurar Supabase
        if: env.TIENE_SUPABASE != 'true'
        run: echo "::warning::Falta el secreto SUPABASE_SECRET_KEY; no se corre la pasada."

      - uses: actions/checkout@v5
        if: env.TIENE_SUPABASE == 'true'

      - uses: pnpm/action-setup@v4
        if: env.TIENE_SUPABASE == 'true'

      - uses: actions/setup-node@v5
        if: env.TIENE_SUPABASE == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        if: env.TIENE_SUPABASE == 'true'
        run: pnpm install --frozen-lockfile --filter "@radar/worker..."

      - name: Pasada
        if: env.TIENE_SUPABASE == 'true'
        working-directory: apps/worker
        env:
          FUENTE: ${{ matrix.fuente }}
          SUPABASE_URL: https://ssmtlqtpzzhkhibkcfhi.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          # Kavak y Yapo bloquean las IPs de GitHub: con proxy residencial funcionan.
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TIPO: ${{ github.event_name == 'schedule' && 'corta' || 'prueba' }}
          MAX_PAGINAS: "3"
          HEADLESS: "0"
        run: xvfb-run -a pnpm pasada
